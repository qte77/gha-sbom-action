---
name: Tag Release

on:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: read

jobs:
  tag:
    uses: qte77/.github/.github/workflows/tag-release.yml@4613389d22779a8d8ba623a418f7c94415e49da9  # main 2026-11-12 (qte77/.github#64)
    permissions:
      contents: write
  publish:
    # Publish the Release in the same run: a tag pushed with GITHUB_TOKEN starts no
    # `on: push: tags` workflow. Skipped when this push created no tag.
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: qte77/.github/.github/workflows/publish-release.yml@4613389d22779a8d8ba623a418f7c94415e49da9  # main 2026-11-12 (qte77/.github#64)
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.tag }}
...
