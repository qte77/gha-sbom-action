---
name: Publish Release

# Manual retry: tag-release publishes new tags itself; dispatch this only to
# retry or to publish an older tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (empty = latest v* tag)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  publish:
    uses: qte77/.github/.github/workflows/publish-release.yml@a32769a925e4d056b5d389ad727f7831973f7161  # main 2026-11-12 (qte77/.github#64)
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag }}
...
