name: "SBOM Generator (Syft + GitHub Depgraph)"
description: "Generate SPDX SBOM files via GitHub dependency graph and Syft, optionally opening a PR"
author: "qte77"

branding:
  icon: "shield"
  color: "blue"

inputs:
  sbom_dir:
    description: "Directory to store SBOM output files"
    required: false
    default: "docs/SBOM"
  python_version:
    description: "Python version for uv to install"
    required: false
    default: "3.12"
  create_pr:
    description: "Whether to open (or update) a PR with SBOM changes"
    required: false
    default: "true"
  auto_merge:
    description: "Enable auto-merge (squash) on the SBOM PR, or merge it directly when auto-merge is unavailable and it is mergeable; only when the run built on main's current tip. 'false' leaves it open for review"
    required: false
    default: "true"
  github_token:
    description: "GitHub token for API access and PR creation"
    required: true

outputs:
  sbom_dir:
    description: "Path to the directory containing generated SBOM files"
    value: ${{ inputs.sbom_dir }}
  changed:
    description: "Whether SBOM files changed ('true' or 'false')"
    value: ${{ steps.check-changes.outputs.changed }}
  pr_url:
    description: "URL of the SBOM PR, newly opened or the open one updated in place (empty if create_pr is false or no changes)"
    value: ${{ steps.create-pr.outputs.pr_url }}

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      shell: bash
      run: uv python install '${{ inputs.python_version }}'

    - name: Install dependencies
      shell: bash
      run: uv sync

    - name: Create SBOM output directory
      shell: bash
      run: mkdir -p '${{ inputs.sbom_dir }}'

    - name: Export GitHub dependency graph SBOM
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        SBOM_DIR: ${{ inputs.sbom_dir }}
      # Reason: on 4xx/5xx gh api still writes the error body to stdout, so write to a temp
      # file outside SBOM_DIR and only move it into place once it parses as an SPDX document.
      run: |
        tmp="${RUNNER_TEMP:-/tmp}/github-depgraph.spdx.json"
        if gh api "repos/$REPO/dependency-graph/sbom" --jq '.sbom' > "$tmp" \
          && jq -e '.spdxVersion' "$tmp" > /dev/null; then
          mv "$tmp" "$SBOM_DIR/github-depgraph.spdx.json"
        else
          echo "::warning::dependency-graph/sbom fetch failed or returned no SPDX document; skipping github-depgraph.spdx.json (is Dependency Graph enabled?)"
          rm -f "$tmp"
        fi

    - name: Cache Syft DB
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/syft
        key: syft-db-${{ runner.os }}

    - name: Install Syft
      uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

    - name: Generate Syft SPDX SBOM
      shell: bash
      env:
        SBOM_DIR: ${{ inputs.sbom_dir }}
      run: syft dir:. -o spdx-json="$SBOM_DIR/syft-scan.spdx.json"

    - name: Check for changes
      id: check-changes
      shell: bash
      env:
        SBOM_DIR: ${{ inputs.sbom_dir }}
      run: |
        git add "$SBOM_DIR/"
        if git diff --cached --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "No SBOM changes detected"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "SBOM changes detected"
        fi

    - name: Create PR
      id: create-pr
      if: inputs.create_pr == 'true' && steps.check-changes.outputs.changed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        AUTO_MERGE: ${{ inputs.auto_merge }}
      # Reason: commit through the API (scripts/api-commit.sh) so GitHub signs it; a runner's
      # local `git commit` is unsigned and is blocked by a required-signatures rule. One fixed
      # branch, force-moved each run, keeps at most one SBOM PR open (scripts/sbom-pr.sh).
      run: |
        BRANCH="auto/sbom-update"
        BASE=$(git rev-parse HEAD)
        COMMIT=$(bash "$GITHUB_ACTION_PATH/scripts/api-commit.sh" "$REPO" "$BASE" "$BRANCH" "docs: update SBOM")
        out=$(bash "$GITHUB_ACTION_PATH/scripts/sbom-pr.sh" "$REPO" "$BRANCH" "$COMMIT" "$BASE" "docs: update SBOM" \
          "Auto-generated SBOM update by [gha-sbom-action](https://github.com/qte77/gha-sbom-action)" "$AUTO_MERGE")
        echo "$out"
        echo "pr_url=$(tail -n1 <<< "$out")" >> "$GITHUB_OUTPUT"
